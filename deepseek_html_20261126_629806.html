            outfit: "亚麻衬衫、棉质长裙、草编包、平底凉鞋。颜色以姜黄、天蓝、陶土、白为主。版型宽松，面料透气。可以有印花和刺绣。",
            makeup: "阳光感底妆，肤色自然。眉形自然，不刻意。眼妆简单，可以省略。唇色选裸色或橘调，自然质地。腮红扫在颧骨，像晒过太阳。",
            home: "藤编家具、陶罐、绿植、白墙、木质地板。空间明亮通透，有自然光。喜欢手工感和天然材质。",
            colors: ["#E6B800", "#87CEEB", "#E2725B", "#FFFFFF"],
            dims: { 冷感:20, 甜度:65, 成熟:50, 量感:50, 锐度:25, 古典:45 }
        }
    };

    const DIM_NAMES = ["冷感", "甜度", "成熟", "量感", "锐度", "古典"];

    // 20道题，每道题对应六个维度的加分（正向或负向）
    // 维度顺序：冷感、甜度、成熟、量感、锐度、古典
    const QUESTIONS = [
        { text: "我更容易被低饱和度的颜色吸引，而不是鲜艳的撞色。", dims: [2, -1, 1, -1, 0, 0] },
        { text: "我会因为一张照片的色调而把它保存下来。", dims: [1, 0, 0, 0, 0, 1] },
        { text: "我喜欢在早晨或傍晚拍照，因为那时光线柔和。", dims: [0, 1, 0, 0, -1, 1] },
        { text: "买衣服时，材质比品牌更能说服我。", dims: [0, 0, 2, -1, 0, 1] },
        { text: "我欣赏旧物上的磨损和使用痕迹。", dims: [0, 0, 1, 0, -1, 2] },
        { text: "我对气味、触感、温度这类感受很敏感。", dims: [1, 1, 0, 0, 0, 0] },
        { text: "我喜欢的穿搭是松弛、不用力的。", dims: [0, 1, 0, -1, -2, 0] },
        { text: "我更偏爱经典款，而不是当季流行。", dims: [0, -1, 2, 0, 0, 1] },
        { text: "我愿意花时间挑一件真正喜欢的东西，而不是快速买很多。", dims: [1, 0, 1, 0, 0, 1] },
        { text: "我不喜欢身上有太多元素，越简单越舒服。", dims: [2, -1, 0, -2, 1, 0] },
        { text: "走进一家店，我先注意到的是整体氛围，而不是某一件单品。", dims: [1, 0, 0, 0, 0, 1] },
        { text: "我喜欢留白多的排版或空间。", dims: [2, 0, 1, -2, 0, 0] },
        { text: "我喜欢的室内是暖色调的，而不是冷白色。", dims: [-2, 2, 0, 0, 0, 1] },
        { text: "我理想的家是干净、安静、有呼吸感的。", dims: [2, -1, 0, -1, 1, 0] },
        { text: "我常常被某部电影的画面风格吸引。", dims: [1, 0, 0, 0, 0, 1] },
        { text: "我喜欢的画面往往安静、克制，而不是热闹的。", dims: [2, -1, 0, 0, 1, 0] },
        { text: "我欣赏那些不刻意、不做作的作品。", dims: [0, 1, 0, 0, -1, 1] },
        { text: "我不喜欢太闪亮或太花哨的东西。", dims: [2, -2, 0, -2, 0, 0] },
        { text: "我常常因为一个包装的设计而决定买不买。", dims: [1, 0, 0, 0, 0, 1] },
        { text: "我宁愿东西少一点，但每一件都要喜欢。", dims: [2, -1, 1, -2, 0, 0] }
    ];

    const OPTIONS = ["非常像我", "像我", "中立", "不像我", "非常不像我"];
    const OPTION_VALUES = [2, 1, 0, -1, -2];

    let dimScores = [0,0,0,0,0,0];
    let currentQ = 0;
    let unlocked = false;

    const lockScreen = document.getElementById('lockScreen');
    const quizScreen = document.getElementById('quizScreen');
    const resultScreen = document.getElementById('resultScreen');
    const pwInput = document.getElementById('passwordInput');
    const unlockBtn = document.getElementById('unlockBtn');
    const lockError = document.getElementById('lockError');
    const questionCounter = document.getElementById('questionCounter');
    const questionDisplay = document.getElementById('questionDisplay');
    const optionsContainer = document.getElementById('optionsContainer');
    const styleName = document.getElementById('styleName');
    const styleSubtitle = document.getElementById('styleSubtitle');
    const styleDesc = document.getElementById('styleDesc');
    const adviceOutfit = document.getElementById('adviceOutfit');
    const adviceMakeup = document.getElementById('adviceMakeup');
    const adviceHome = document.getElementById('adviceHome');
    const adviceColors = document.getElementById('adviceColors');
    const restartBtn = document.getElementById('restartBtn');
    const lockBtn = document.getElementById('lockBtn');
    const radarCanvas = document.getElementById('radarCanvas');

    function resetScores() { dimScores = [0,0,0,0,0,0]; }

    function startQuiz() {
        resetScores();
        currentQ = 0;
        lockScreen.classList.add('hidden');
        resultScreen.classList.add('hidden');
        quizScreen.classList.remove('hidden');
        renderQuestion();
    }

    function renderQuestion() {
        if (currentQ < QUESTIONS.length) {
            const q = QUESTIONS[currentQ];
            questionDisplay.textContent = q.text;
            questionCounter.textContent = `第${currentQ+1}问 / 共${QUESTIONS.length}问`;
            let html = '';
            for (let i=0; i<OPTIONS.length; i++) {
                html += `<button class="option-btn" data-value="${OPTION_VALUES[i]}">${OPTIONS[i]}</button>`;
            }
            optionsContainer.innerHTML = html;
            document.querySelectorAll('.option-btn').forEach(b => {
                b.addEventListener('click', onSelect);
            });
        } else {
            finishQuiz();
        }
    }

    function onSelect(e) {
        const value = parseInt(e.currentTarget.dataset.value);
        const impacts = QUESTIONS[currentQ].dims;
        for (let i=0; i<6; i++) dimScores[i] += impacts[i] * value;
        currentQ++;
        renderQuestion();
    }

    function normalizeScores() {
        let minScore = Math.min(...dimScores);
        let maxScore = Math.max(...dimScores);
        if (maxScore === minScore) return dimScores.map(() => 50);
        return dimScores.map(s => Math.round((s - minScore) / (maxScore - minScore) * 80 + 10));
    }

    function drawRadar(normScores) {
        const ctx = radarCanvas.getContext('2d');
        const w = radarCanvas.width = 300;
        const h = radarCanvas.height = 300;
        const cx = w/2, cy = h/2, r = 105;
        const count = 6;
        ctx.clearRect(0,0,w,h);

        for (let i=1; i<=4; i++) {
            ctx.beginPath();
            ctx.strokeStyle = '#e0ddda';
            ctx.lineWidth = 0.5;
            for (let j=0; j<count; j++) {
                const ang = Math.PI*2/count*j - Math.PI/2;
                const x = cx + r/4*i * Math.cos(ang);
                const y = cy + r/4*i * Math.sin(ang);
                if (j===0) ctx.moveTo(x,y);
                else ctx.lineTo(x,y);
            }
            ctx.closePath();
            ctx.stroke();
        }

        for (let j=0; j<count; j++) {
            const ang = Math.PI*2/count*j - Math.PI/2;
            const x = cx + r * Math.cos(ang);
            const y = cy + r * Math.sin(ang);
            ctx.beginPath();
            ctx.moveTo(cx,cy);
            ctx.lineTo(x,y);
            ctx.strokeStyle = '#e0ddda';
            ctx.stroke();
            ctx.fillStyle = '#888888';
            ctx.font = '11px "Songti SC", "宋体", serif';
            ctx.textAlign = 'center';
            const lx = cx + (r+20) * Math.cos(ang);
            const ly = cy + (r+16) * Math.sin(ang);
            ctx.fillText(DIM_NAMES[j], lx, ly);
        }

        ctx.beginPath();
        for (let j=0; j<count; j++) {
            const ang = Math.PI*2/count*j - Math.PI/2;
            const val = normScores[j]/100;
            const x = cx + r*val * Math.cos(ang);
            const y = cy + r*val * Math.sin(ang);
            if (j===0) ctx.moveTo(x,y);
            else ctx.lineTo(x,y);
        }
        ctx.closePath();
        ctx.fillStyle = 'rgba(120,120,120,0.15)';
        ctx.fill();
        ctx.strokeStyle = '#8a8a8a';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        for (let j=0; j<count; j++) {
            const ang = Math.PI*2/count*j - Math.PI/2;
            const x = cx + r*normScores[j]/100 * Math.cos(ang);
            const y = cy + r*normScores[j]/100 * Math.sin(ang);
            ctx.beginPath();
            ctx.arc(x,y,3,0,Math.PI*2);
            ctx.fillStyle = '#888888';
            ctx.fill();
        }
    }

    function finishQuiz() {
        let bestStyle = 'jijian';
        let bestSim = -1;
        for (let styleId in STYLES) {
            const styleDims = STYLES[styleId].dims;
            const weights = DIM_NAMES.map(n => styleDims[n] / 100);
            let dot = 0, magUser = 0, magStyle = 0;
            for (let i=0; i<6; i++) {
                dot += dimScores[i] * weights[i];
                magUser += dimScores[i] * dimScores[i];
                magStyle += weights[i] * weights[i];
            }
            magUser = Math.sqrt(magUser);
            magStyle = Math.sqrt(magStyle);
            if (magUser === 0 || magStyle === 0) continue;
            const sim = dot / (magUser * magStyle);
            if (sim > bestSim) {
                bestSim = sim;
                bestStyle = styleId;
            }
        }

        const detail = STYLES[bestStyle];
        styleName.textContent = detail.name;
        styleSubtitle.textContent = detail.subtitle;
        styleDesc.textContent = detail.desc;
        adviceOutfit.textContent = detail.outfit;
        adviceMakeup.textContent = detail.makeup;
        adviceHome.textContent = detail.home;
        adviceColors.innerHTML = detail.colors.map(c => 
            `<div class="color-item"><span class="color-dot" style="background:${c}"></span>${c}</div>`
        ).join('');

        drawRadar(normalizeScores());

        quizScreen.classList.add('hidden');
        resultScreen.classList.remove('hidden');
    }

    function resetLock() {
        pwInput.value='';
        lockError.textContent='';
        unlocked=false;
        quizScreen.classList.add('hidden');
        resultScreen.classList.add('hidden');
        lockScreen.classList.remove('hidden');
    }

    unlockBtn.addEventListener('click', ()=>{
        if(pwInput.value.trim()===FIXED_PASSWORD) {
            unlocked=true;
            startQuiz();
        } else {
            lockError.textContent='口令错误';
            pwInput.value='';
        }
    });
    pwInput.addEventListener('keypress', e=>{ if(e.key==='Enter') unlockBtn.click(); });
    restartBtn.addEventListener('click', ()=>{ if(unlocked) startQuiz(); else resetLock(); });
    lockBtn.addEventListener('click', resetLock);
    document.addEventListener('contextmenu', e=>e.preventDefault());
    resetLock();
})();
</script>
</body>
</html>
